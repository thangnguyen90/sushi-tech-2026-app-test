name: Deploy to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: eventech-dev-app
  IMAGE_TAG: ${{ github.sha }}

# Bắt buộc để OIDC hoạt động - cho phép GitHub lấy token từ AWS
permissions:
  id-token: write   # Lấy OIDC token từ GitHub
  contents: read    # Đọc source code

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Kết nối AWS qua OIDC — không cần Access Key / Secret Key
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}  # ARN từ terraform output github_actions_role_arn
          aws-region: ${{ env.AWS_REGION }}
          # Không có aws-access-key-id / aws-secret-access-key

      # 3. Đăng nhập ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build và push Docker image lên ECR
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 5. SSH vào EC2 và deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}  # Chỉ cần SSH key, không cần AWS key
          script: |
            # EC2 tự lấy credentials qua IAM role (không cần aws configure)
            aws ecr get-login-password --region ap-northeast-1 | \
              docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            docker pull ${{ steps.build-image.outputs.image }}

            docker stop eventech-app 2>/dev/null || true
            docker rm eventech-app 2>/dev/null || true

            docker run -d \
              --name eventech-app \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /home/ubuntu/app/.env \
              ${{ steps.build-image.outputs.image }}

            docker exec eventech-app php artisan migrate --force
            docker image prune -f

            echo "✅ Deploy thành công: ${{ steps.build-image.outputs.image }}"
