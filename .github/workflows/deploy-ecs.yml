name: Deploy ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: eventech-app
  ECS_CLUSTER: eventech-production
  ECS_WEB_SERVICE: eventech-web
  ECS_QUEUE_SERVICE: eventech-queue
  ECS_WEB_TASK_FAMILY: eventech-web
  ECS_QUEUE_TASK_FAMILY: eventech-queue
  ECS_MIGRATE_TASK_FAMILY: eventech-migrate
  ECS_CONTAINER_NAME: app

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ftp, intl, pdo_mysql, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test --compact

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definitions
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_MIGRATE_TASK_FAMILY" \
            --query taskDefinition > /tmp/migrate-task-definition-raw.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            /tmp/migrate-task-definition-raw.json > /tmp/migrate-task-definition.json

          aws ecs describe-task-definition \
            --task-definition "$ECS_WEB_TASK_FAMILY" \
            --query taskDefinition > /tmp/web-task-definition-raw.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            /tmp/web-task-definition-raw.json > /tmp/web-task-definition.json

          aws ecs describe-task-definition \
            --task-definition "$ECS_QUEUE_TASK_FAMILY" \
            --query taskDefinition > /tmp/queue-task-definition-raw.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            /tmp/queue-task-definition-raw.json > /tmp/queue-task-definition.json

      - name: Render migration task definition
        id: render-migrate-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/migrate-task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Register migration task definition
        id: register-migrate-task
        run: |
          TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.render-migrate-task.outputs.task-definition }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "task-definition-arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Run migration task
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-migrate-task.outputs.task-definition-arn }}
          ECS_SUBNETS: ${{ secrets.ECS_PRIVATE_SUBNETS }}
          ECS_SECURITY_GROUPS: ${{ secrets.ECS_SECURITY_GROUPS }}
        run: |
          TASK_ARN="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`app`].exitCode | [0]' \
            --output text)"

          test "$EXIT_CODE" = "0"

      - name: Render web task definition
        id: render-web-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/web-task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web-task.outputs.task-definition }}
          service: ${{ env.ECS_WEB_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render queue task definition
        id: render-queue-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/queue-task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy queue service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-queue-task.outputs.task-definition }}
          service: ${{ env.ECS_QUEUE_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
